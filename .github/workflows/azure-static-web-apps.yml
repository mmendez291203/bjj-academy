# ─────────────────────────────────────────────────────────────────────────────
# CI/CD — Azure App Service con Next.js Standalone
#
# El modo standalone genera solo los archivos necesarios (~50MB vs ~500MB).
# Deploy rápido, sin subir node_modules completo.
# ─────────────────────────────────────────────────────────────────────────────

name: Deploy to Azure App Service

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 📦 Instalar dependencias
        run: npm install --legacy-peer-deps

      - name: 🏗️ Build de producción (modo standalone)
        run: npm run build
        env:
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
          NEXT_PUBLIC_ACADEMY_NAME: ${{ vars.NEXT_PUBLIC_ACADEMY_NAME }}
          NEXT_PUBLIC_ACADEMY_PHONE: ${{ vars.NEXT_PUBLIC_ACADEMY_PHONE }}
          NEXT_PUBLIC_ACADEMY_EMAIL: ${{ vars.NEXT_PUBLIC_ACADEMY_EMAIL }}

      - name: 📂 Copiar archivos estáticos al standalone
        run: |
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public

      - name: 📦 Comprimir solo el standalone (~50MB)
        # ⚠️  Zipear DESDE DENTRO de standalone para que server.js quede en la
        #     raíz del zip → /home/site/wwwroot/server.js (no en un subdirectorio)
        run: |
          cd .next/standalone
          zip -r ../../deploy.zip .

      - name: 🚀 Deploy a Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'bjj-academy-app'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: deploy.zip
