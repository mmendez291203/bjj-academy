# ─────────────────────────────────────────────────────────────────────────────
# CI/CD — Azure Static Web Apps
#
# Se ejecuta automáticamente cuando:
# - Haces push a main          → deploy a producción
# - Abres un Pull Request      → deploy de preview
# - Cierras un Pull Request    → limpia el entorno de preview
#
# SETUP INICIAL:
# 1. Crea tu Azure Static Web App en el portal
# 2. Copia el deployment token en GitHub → Settings → Secrets → Actions
#    Nombre del secret: AZURE_STATIC_WEB_APPS_API_TOKEN
# 3. Agrega tus variables de entorno en:
#    - GitHub Secrets: COSMOS_DB_KEY, NEXTAUTH_SECRET, etc.
#    - Azure Static Web Apps → Configuration → Application settings
# ─────────────────────────────────────────────────────────────────────────────

name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  # ─── Build y Deploy ──────────────────────────────────────────────────────────
  build_and_deploy:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy

    steps:
      - name: 📥 Checkout del repositorio
        uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Instalar dependencias
        run: npm ci --legacy-peer-deps

      - name: 🔍 TypeScript check
        run: npx tsc --noEmit

      - name: 🧹 ESLint
        run: npm run lint

      - name: 🏗️ Build de producción
        run: npm run build
        env:
          # Variables de build (no sensibles)
          NEXT_PUBLIC_ACADEMY_NAME:    ${{ vars.NEXT_PUBLIC_ACADEMY_NAME }}
          NEXT_PUBLIC_ACADEMY_PHONE:   ${{ vars.NEXT_PUBLIC_ACADEMY_PHONE }}
          NEXT_PUBLIC_ACADEMY_EMAIL:   ${{ vars.NEXT_PUBLIC_ACADEMY_EMAIL }}
          NEXT_PUBLIC_ACADEMY_ADDRESS: ${{ vars.NEXT_PUBLIC_ACADEMY_ADDRESS }}
          # Variables sensibles (desde GitHub Secrets)
          NEXTAUTH_SECRET:             ${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL:                ${{ secrets.NEXTAUTH_URL }}

      - name: 🚀 Deploy a Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token:                      ${{ secrets.GITHUB_TOKEN }}
          action:                          "upload"
          app_location:                    "/"          # Raíz del proyecto Next.js
          output_location:                 "out"        # Carpeta de output estático
          app_build_command:               "npm run build"

  # ─── Limpiar PR preview ───────────────────────────────────────────────────────
  close_pull_request:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Environment

    steps:
      - name: 🧹 Cerrar entorno de preview
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action:                          "close"
