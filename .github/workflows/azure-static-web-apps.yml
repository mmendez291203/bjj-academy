# ─────────────────────────────────────────────────────────────────────────────
# CI/CD — Azure App Service
#
# Estrategia:
# 1. GitHub Actions construye el proyecto completo
# 2. Sube los archivos ya construidos a Azure (Azure NO vuelve a construir)
# ─────────────────────────────────────────────────────────────────────────────

name: Deploy to Azure App Service

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 📦 Instalar TODAS las dependencias
        run: npm install --legacy-peer-deps

      - name: 🏗️ Build de producción
        run: npm run build
        env:
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
          NEXT_PUBLIC_ACADEMY_NAME: ${{ vars.NEXT_PUBLIC_ACADEMY_NAME }}
          NEXT_PUBLIC_ACADEMY_PHONE: ${{ vars.NEXT_PUBLIC_ACADEMY_PHONE }}
          NEXT_PUBLIC_ACADEMY_EMAIL: ${{ vars.NEXT_PUBLIC_ACADEMY_EMAIL }}

      - name: 🧹 Remover devDependencies antes de subir
        run: npm prune --production --legacy-peer-deps

      - name: 🚀 Deploy a Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'bjj-academy-app'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: .
